<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spinning Book a Tour</title>

<!-- Montserrat font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* APPLY MONTSERRAT GLOBALLY */
  * {
    font-family: 'Montserrat', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fff;
    margin: 0;
  }

  .circle-wrapper {
    position: relative;
    width: 300px;
    height: 300px;
  }

  /* RED CENTER CIRCLE */
  .center-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 180px;
    height: 180px;
    background: #f44336;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.3;
    z-index: 2;
  }

  /* SPINNING TEXT */
  svg {
    width: 100%;
    height: 100%;
    animation: spin 12s linear infinite;
  }

  text {
    font-size: 16px;
    letter-spacing: 1px;
    fill: #777;
    text-transform: uppercase;
    font-weight: 400;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>

<body>

<div class="circle-wrapper">

  <!-- Spinning text -->
  <svg viewBox="0 0 300 300">
    <defs>
      <path
        id="circlePath"
        d="
          M 150,150
          m -120,0
          a 120,120 0 1,1 240,0
          a 120,120 0 1,1 -240,0
        "
      />
    </defs>

    <text>
      <textPath href="#circlePath">
        BOOK A TOUR ~ BOOK A TOUR ~ BOOK A TOUR ~ BOOK A TOUR ~ BOOK A TOUR ~
      </textPath>
    </text>
  </svg>

  <!-- Center red circle -->
  <div class="center-circle">
    The distillery<br>
    is open to the<br>
    public
  </div>

</div>

</body>
</html>
